<!DOCTYPE html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self' https:; worker-src 'self' blob:; object-src 'none'; base-uri 'none'; form-action 'none'"
    />
    <meta name="referrer" content="no-referrer" />
    <title>CSAF Visualizer &mdash; Schema Explorer &amp; Advisory Viewer</title>
    <meta
      name="description"
      content="Interactive viewer and validator for OASIS CSAF 2.0 and 2.1 security advisories and JSON schemas."
    />
    <meta name="author" content="Omar Santos" />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="css/tokens.css" />
    <link rel="stylesheet" href="css/app.css" />
    <link rel="stylesheet" href="css/tree.css" />
    <link rel="stylesheet" href="css/report.css" />

    <!-- Ace editor (classic script, self-hosted) -->
    <script src="js/vendor/ace/ace.js" defer></script>
  </head>
  <body>
    <div class="app">
      <!-- Toolbar -->
      <header class="toolbar" id="toolbar">
        <div class="brand">
          <svg class="logo" viewBox="0 0 24 24" aria-hidden="true">
            <path
              fill="currentColor"
              d="M12 2 4 5v6c0 5 3.4 8.6 8 11 4.6-2.4 8-6 8-11V5l-8-3Z"
              opacity="0.25"
            />
            <path
              fill="none"
              stroke="currentColor"
              stroke-width="1.6"
              stroke-linecap="round"
              stroke-linejoin="round"
              d="M12 2 4 5v6c0 5 3.4 8.6 8 11 4.6-2.4 8-6 8-11V5l-8-3Zm-3.2 10 2.2 2.4L15.4 9"
            />
          </svg>
          <span
            >CSAF Visualizer<span class="sub">&nbsp;json.csaf.io</span></span
          >
        </div>

        <div class="toolbar-group" role="tablist" aria-label="View mode">
          <button class="btn" id="mode-schema" type="button">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
            Schema
          </button>
          <button class="btn" id="mode-advisory" type="button">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M12 2 4 5v6c0 5 3.4 8.6 8 11 4.6-2.4 8-6 8-11V5Z"/></svg>
            Advisory
          </button>
        </div>

        <div class="toolbar-spacer"></div>

        <!-- Primary way to get content in: load a sample or open a file -->
        <div class="field field-primary">
          <span class="field-label">Start here</span>
          <select class="select select-primary" id="example-select" title="Load a bundled CSAF example or schema">
            <option value="">Load an example&hellip;</option>
          </select>
          <button class="btn btn-outline" id="open-btn" type="button" title="Open a .json file from your computer">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
            Open file
          </button>
        </div>

        <div class="field">
          <span class="field-label">Validate as</span>
          <select class="select" id="version-select" title="Which CSAF version to validate against">
            <option value="2.0">CSAF 2.0</option>
            <option value="2.1">CSAF 2.1</option>
          </select>
        </div>

        <div class="toolbar-group toolbar-icons">
          <button class="btn btn-icon" id="editor-toggle" type="button" title="Show/hide the JSON editor pane">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M9 3v18M4 3h16v18H4z"/></svg>
          </button>

          <button class="btn btn-icon" id="theme-toggle" type="button" title="Toggle light/dark theme">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M5 5l1.5 1.5M17.5 17.5 19 19M19 5l-1.5 1.5M6.5 17.5 5 19"/></svg>
          </button>

          <a class="btn btn-icon" id="repo-link" href="https://github.com/santosomar/csaf-json-visualizer" target="_blank" rel="noopener noreferrer" title="Source on GitHub">
          <svg viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8Z"/></svg>
          </a>
        </div>
      </header>

      <!-- Main split: editor | gutter | view -->
      <div class="main" id="main">
        <section class="pane pane-editor" id="pane-editor" aria-label="JSON source editor">
          <div id="editor"></div>
        </section>
        <div class="gutter" id="gutter" role="separator" aria-orientation="vertical" tabindex="0"></div>
        <section class="pane pane-view" id="pane-view" aria-label="Visualization"></section>
      </div>

      <!-- Status bar -->
      <footer class="statusbar" id="statusbar">
        <span class="status-dot" id="status-mode">Schema mode</span>
        <span class="status-dot" id="status-valid">Not validated</span>
        <span class="spacer"></span>
        <span id="status-detected"></span>
        <a class="status-link" id="findings-toggle">Findings</a>
      </footer>
    </div>

    <!-- Drag & drop overlay -->
    <div class="dropzone-overlay" id="dropzone">
      <div class="dropzone-card">Drop a CSAF JSON file to load</div>
    </div>

    <!-- Toasts -->
    <div class="toast-stack" id="toasts" aria-live="polite"></div>

    <!-- Hidden file input -->
    <input type="file" id="file-input" accept=".json,application/json" class="hidden" />

    <script type="module" src="js/main.js"></script>
  </body>
</html>
